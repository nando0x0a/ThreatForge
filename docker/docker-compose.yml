services:
  vuln-skill:
    image: vuln-skill
    container_name: vuln-skill
    restart: unless-stopped

    env_file:
      - /opt/docker/vuln-skill/config/.env

    volumes:
      - /opt/docker/vuln-skill/outputs:/opt/vuln-skill/outputs
      - /opt/docker/vuln-skill/logs:/opt/vuln-skill/logs
      # Directory-level mount, not per-file — a per-file bind mount pins to
      # the inode at container-creation time, so editors/scripts that replace
      # rather than truncate-in-place (sed -i, cp of a new file, etc.) silently
      # orphan it. Mounting the directory resolves by path on every access.
      - /opt/docker/vuln-skill/config:/opt/vuln-skill/config:ro

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/opt/vuln-skill/src
      - PDCP_API_KEY=${PDTM_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}

    networks:
      - infra

    healthcheck:
      test: ["CMD", "python3", "-c", "import anthropic, openai; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  vuln-skill-web:
    image: vuln-skill
    container_name: vuln-skill-web
    restart: unless-stopped
    command: uvicorn web:app --host 0.0.0.0 --port 8000 --app-dir /opt/vuln-skill/src

    env_file:
      - /opt/docker/vuln-skill/config/.env

    volumes:
      - /opt/docker/vuln-skill/outputs:/opt/vuln-skill/outputs
      - /opt/docker/vuln-skill/logs:/opt/vuln-skill/logs
      # NOT :ro, unlike the vuln-skill service above — the web UI's config
      # editors (products.txt, pipeline/scoring settings) write here.
      - /opt/docker/vuln-skill/config:/opt/vuln-skill/config
      # Chat assistant (plan steps 3-4): the system prompt intentionally
      # lives in the separate vuln-skill-cloud repo, not this one -- see
      # that file's own header note and Cloud/index.md for why. Mounted
      # read-only since this container never writes to it. Only needed by
      # vuln-skill-web (which imports web.py); the vuln-skill service
      # runs the CLI/cron entrypoint and never touches this code path.
      - /home/ubuntu/vuln-skill-cloud-prompt-repo/prompt:/opt/vuln-skill-cloud-prompt:ro
      - /opt/docker/vuln-skill/chat_data:/opt/vuln-skill/chat_data

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/opt/vuln-skill/src
      - PDCP_API_KEY=${PDTM_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}

    ports:
      # Bound to localhost only — nginx on the host reverse-proxies to this
      # (with TLS + HTTP Basic Auth). Never exposed directly; the security
      # group doesn't even open 8000 externally, this is defense in depth.
      - "127.0.0.1:8000:8000"

    networks:
      - infra

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  infra:
    external: true
