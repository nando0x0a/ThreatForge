services:
  threatforge:
    image: threatforge
    container_name: threatforge
    restart: unless-stopped

    env_file:
      - /opt/docker/threatforge/config/.env

    volumes:
      - /opt/docker/threatforge/outputs:/opt/threatforge/outputs
      - /opt/docker/threatforge/logs:/opt/threatforge/logs
      # Directory-level mount, not per-file — a per-file bind mount pins to
      # the inode at container-creation time, so editors/scripts that replace
      # rather than truncate-in-place (sed -i, cp of a new file, etc.) silently
      # orphan it. Mounting the directory resolves by path on every access.
      - /opt/docker/threatforge/config:/opt/threatforge/config:ro

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/opt/threatforge/src
      - PDCP_API_KEY=${PDTM_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}

    networks:
      - infra

    healthcheck:
      test: ["CMD", "python3", "-c", "import anthropic, openai; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  threatforge-web:
    image: threatforge
    container_name: threatforge-web
    restart: unless-stopped
    command: uvicorn web:app --host 0.0.0.0 --port 8000 --app-dir /opt/threatforge/src

    env_file:
      - /opt/docker/threatforge/config/.env

    volumes:
      - /opt/docker/threatforge/outputs:/opt/threatforge/outputs
      - /opt/docker/threatforge/logs:/opt/threatforge/logs
      # NOT :ro, unlike the threatforge service above — the web UI's config
      # editors (products.txt, pipeline/scoring settings) write here.
      - /opt/docker/threatforge/config:/opt/threatforge/config

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/opt/threatforge/src
      - PDCP_API_KEY=${PDTM_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}

    ports:
      # Bound to localhost only — nginx on the host reverse-proxies to this
      # (with TLS + HTTP Basic Auth). Never exposed directly; the security
      # group doesn't even open 8000 externally, this is defense in depth.
      - "127.0.0.1:8000:8000"

    networks:
      - infra

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  infra:
    external: true
