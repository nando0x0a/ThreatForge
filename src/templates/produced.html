{% if skipped %}
<p class="muted">Nothing selected — pick at least one CVE and one output type.</p>
{% else %}
<table>
  <thead><tr><th>CVE</th><th>Output</th><th>Status</th><th>File</th></tr></thead>
  <tbody>
    {% for p in produced %}
    <tr>
      <td>{{ p.cve_id }}</td>
      <td>{{ p.output_type }}</td>
      <td class="{{ 'ok' if p.status == 'OK' else 'warn' }}">
        {{ p.status }}
        {% if p.error %}<div class="error-detail">{{ p.error }}</div>{% endif %}
      </td>
      <td><a href="{{ p.github_url or '/outputs' }}" target="_blank" rel="noopener">{{ p.file }}</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<p><a href="/outputs">View all in Outputs →</a></p>
{% endif %}
